<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العوائل والمساعدات الخيرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        window.firebaseApp = initializeApp({
            apiKey: "AIzaSyDummyKeyForArchitectureDemoOnly12345",
            authDomain: "charity-app-demo.firebaseapp.com",
            projectId: "charity-app-demo"
        });
        window.auth = getAuth(window.firebaseApp);
        window.db = getFirestore(window.firebaseApp);
        window.firebaseFns = { signInWithEmailAndPassword, signOut, onAuthStateChanged, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, getDoc };
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        darkBg: '#0f172a',
                        darkCard: '#1e293b'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; transition: background-color 0.3s, color 0.3s; }
        html { font-size: 16px; transition: font-size 0.3s; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-effect { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden">

    <div id="auth-screen" class="fixed inset-0 bg-darkBg z-[100] flex justify-center items-center p-4">
        <div class="bg-darkCard w-full max-w-md p-8 rounded-3xl shadow-2xl border border-slate-800 space-y-6">
            <div class="text-center">
                <div class="w-16 h-16 bg-primary/20 text-primary rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                    <i aria-hidden="true" class="fa-solid fa-hands-holding-child"></i>
                </div>
                <h2 class="text-xl font-bold text-white">تسجيل الدخول للنظام</h2>
                <p class="text-xs text-slate-400 mt-1">أدخل بريدك الإلكتروني وكلمة المرور للمتابعة</p>
            </div>
            <div class="space-y-4">
                <input aria-label="البريد الإلكتروني" type="email" id="auth-email" placeholder="البريد الإلكتروني" class="w-full bg-slate-900 text-white p-4 rounded-xl outline-none text-sm border border-slate-700 focus:border-primary font-sans">
                <input aria-label="كلمة المرور" type="password" id="auth-password" placeholder="كلمة المرور" class="w-full bg-slate-900 text-white p-4 rounded-xl outline-none text-sm border border-slate-700 focus:border-primary font-sans">
                <button aria-label="تسجيل الدخول" onclick="handleLogin()" class="w-full bg-primary hover:bg-secondary text-white font-bold py-4 rounded-xl text-sm shadow-lg transition-all">دخول</button>
                <div id="auth-error" class="text-red-500 text-xs text-center hidden"></div>
            </div>
        </div>
    </div>

    <nav class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg z-10 flex-shrink-0">
        <div class="max-w-xl mx-auto flex justify-between relative">
            <button aria-label="الرئيسية" onclick="navigateTo('main')" id="tab-main" class="flex-1 py-4 text-center font-bold border-b-4 border-white transition-all">الرئيسية</button>
            <button aria-label="المفضلة" onclick="navigateTo('fav')" id="tab-fav" class="flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all">المفضلة</button>
            <button aria-label="الرسائل" onclick="navigateTo('messages')" id="tab-messages" class="flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all">الرسائل</button>
            <button aria-label="الإعدادات" onclick="navigateTo('settings')" id="tab-settings" class="flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all">الإعدادات</button>
        </div>
    </nav>

    <div id="search-container" class="bg-white dark:bg-darkCard p-3 shadow-sm z-10 flex-shrink-0 transition-colors">
        <div class="max-w-xl mx-auto flex gap-3 items-center">
            <div class="relative flex-1">
                <input aria-label="مربع البحث عن عائلة" type="text" id="search-input" onkeyup="renderFamilies()" placeholder="ابحث بالاسم الثلاثي أو الرباعي..." class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white border-none rounded-2xl py-3 px-10 focus:ring-2 focus:ring-primary outline-none text-sm transition-colors">
                <i aria-hidden="true" class="fa-solid fa-search absolute right-4 top-3.5 text-slate-400"></i>
            </div>
            <button aria-label="إضافة عائلة جديدة" onclick="document.getElementById('f-id').value=''; navigateTo('form-modal'); openFormStep(1);" class="bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-white px-5 py-3 rounded-2xl font-bold text-sm shadow-md transition-all flex items-center gap-2 flex-shrink-0">
                <i aria-hidden="true" class="fa-solid fa-plus"></i> إضافة
            </button>
        </div>
    </div>

    <main class="flex-1 overflow-y-auto p-4 hide-scroll relative">
        <div id="view-main" class="max-w-xl mx-auto space-y-4">
            <div id="empty-state" class="hidden flex flex-col items-center justify-center mt-32 text-slate-400">
                <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4 shadow-inner">
                    <i aria-hidden="true" class="fa-solid fa-users text-4xl text-slate-300 dark:text-slate-600"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-500 dark:text-slate-400">لا توجد عوائل مسجلة</h2>
            </div>
            <div id="families-list" class="space-y-3 pb-20"></div>
        </div>

        <div id="view-fav" class="max-w-xl mx-auto space-y-3 hidden pb-20">
            <div id="fav-list" class="space-y-3"></div>
        </div>

        <div id="view-messages" class="max-w-xl mx-auto space-y-3 hidden pb-20">
            <div id="messages-list" class="space-y-3"></div>
        </div>

        <div id="view-settings" class="max-w-xl mx-auto hidden mt-6 space-y-4">
            <div class="bg-white dark:bg-darkCard p-5 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors space-y-4">
                <div class="flex justify-between items-center py-3 border-b border-slate-100 dark:border-slate-700">
                    <span class="font-bold text-sm">الوضع الليلي</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input aria-label="تفعيل أو تعطيل الوضع الليلي" type="checkbox" id="dark-mode-toggle" class="sr-only peer" onchange="toggleTheme()">
                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:translate-x-[-100%] rtl:peer-checked:after:-translate-x-full after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-primary"></div>
                    </label>
                </div>
                <div class="flex justify-between items-center py-3 border-b border-slate-100 dark:border-slate-700">
                    <span class="font-bold text-sm">حجم الخط</span>
                    <select aria-label="تغيير حجم الخط" id="font-size-select" onchange="changeFontSize(this.value)" class="bg-slate-100 dark:bg-slate-800 dark:text-white px-4 py-2 rounded-xl text-sm outline-none border-none focus:ring-2 focus:ring-primary">
                        <option value="14px">صغير</option>
                        <option value="16px" selected>متوسط (الافتراضي)</option>
                        <option value="18px">كبير</option>
                        <option value="20px">كبير جداً</option>
                    </select>
                </div>
                <div class="pt-2">
                    <button aria-label="تسجيل الخروج" onclick="handleLogout()" class="w-full bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 font-bold py-3 rounded-xl text-sm transition-colors flex items-center justify-center gap-2">
                        <i aria-hidden="true" class="fa-solid fa-right-from-bracket"></i> تسجيل الخروج
                    </button>
                </div>
            </div>
        </div>
    </main>

    <div id="form-modal" class="fixed inset-0 bg-black/60 glass-effect z-50 hidden flex justify-center items-end sm:items-center transition-opacity">
        <div class="bg-white dark:bg-darkCard w-full sm:max-w-2xl h-[92vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900">
                <h2 id="form-title" class="text-lg font-bold text-primary dark:text-indigo-400">إضافة عائلة جديدة</h2>
                <button aria-label="إغلاق النافذة" onclick="history.back()" class="text-slate-400 hover:text-red-500 bg-slate-200 dark:bg-slate-800 rounded-full w-8 h-8 flex justify-center items-center transition-colors"><i class="fa-solid fa-times"></i></button>
            </div>
            
            <div class="flex bg-slate-100 dark:bg-slate-800 border-b dark:border-slate-700 text-xs font-bold text-center">
                <div id="step-ind-1" class="flex-1 py-3 bg-primary text-white">1. الأساسية</div>
                <div id="step-ind-2" class="flex-1 py-3 text-slate-500 dark:text-slate-400">2. التصنيف</div>
                <div id="step-ind-3" class="flex-1 py-3 text-slate-500 dark:text-slate-400">3. الأسرة</div>
                <div id="step-ind-4" class="flex-1 py-3 text-slate-500 dark:text-slate-400">4. المعيشة</div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-4">
                <input type="hidden" id="f-id">
                
                <div id="form-step-1" class="space-y-4">
                    <input aria-label="الاسم الثلاثي واللقب" type="text" id="f-name" placeholder="الاسم الثلاثي واللقب" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                    <div class="grid grid-cols-2 gap-3">
                        <select aria-label="الحالة الزوجية" id="f-marital" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">الحالة الزوجية</option>
                            <option value="متزوج">متزوج</option>
                            <option value="أعزب">أعزب</option>
                            <option value="أرمل">أرمل</option>
                            <option value="مطلق">مطلق</option>
                        </select>
                        <input aria-label="اسم الزوج أو الزوجة الثلاثي" type="text" id="f-spouse" placeholder="اسم الزوج/الزوجة الثلاثي" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <input aria-label="رقم البطاقة الوطنية" type="tel" inputmode="numeric" id="f-nid" placeholder="رقم البطاقة الوطنية" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input aria-label="رقم البطاقة التموينية" type="tel" inputmode="numeric" id="f-ration" placeholder="رقم البطاقة التموينية" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input aria-label="رقم بطاقة السكن" type="tel" inputmode="numeric" id="f-residence" placeholder="رقم بطاقة السكن" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input aria-label="رقم الهاتف الأول" type="tel" inputmode="numeric" id="f-phone1" placeholder="رقم الهاتف" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input aria-label="رقم هاتف ثاني" type="tel" inputmode="numeric" id="f-phone2" placeholder="رقم هاتف ثاني" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                    </div>
                    <textarea aria-label="العنوان" id="f-address" placeholder="العنوان" rows="2" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary resize-none"></textarea>
                    <div class="grid grid-cols-2 gap-3">
                        <input aria-label="أقرب نقطة دالة" type="text" id="f-nearest" placeholder="أقرب نقطة دالة" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                        <input aria-label="اسم المختار" type="text" id="f-mukhtar" placeholder="اسم المختار" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                    </div>
                </div>

                <div id="form-step-2" class="space-y-4 hidden">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <select aria-label="صنف الحالة" id="f-category" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">صنف الحالة</option>
                            <option value="متعفف">متعفف</option>
                            <option value="أرملة">أرملة</option>
                            <option value="أيتام">أيتام</option>
                            <option value="ذوي إعاقة">ذوي إعاقة</option>
                            <option value="مهجورة">مهجورة</option>
                            <option value="مطلقة">مطلقة</option>
                            <option value="كبير السن">كبير السن</option>
                            <option value="عاطل عن العمل">عاطل عن العمل</option>
                            <option value="محدود الدخل">محدود الدخل</option>
                            <option value="نازح">نازح</option>
                            <option value="أسرة بلا معيل">أسرة بلا معيل</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                        <select aria-label="مستوى الحاجة" id="f-need-level" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">مستوى الحاجة</option>
                            <option value="معدوم الدخل">معدوم الدخل</option>
                            <option value="شديد الاحتياج">شديد الاحتياج</option>
                            <option value="متوسط الاحتياج">متوسط الاحتياج</option>
                            <option value="محدود الاحتياج">محدود الاحتياج</option>
                            <option value="مستقر">مستقر</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <select aria-label="درجة الأولوية" id="f-priority" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">درجة الأولوية</option>
                            <option value="عاجلة جدا">عاجلة جداً</option>
                            <option value="عاجلة">عاجلة</option>
                            <option value="متوسطة">متوسطة</option>
                            <option value="منخفضة">منخفضة</option>
                        </select>
                        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl">
                            <span class="text-sm text-slate-500">تاريخ التسجيل:</span>
                            <input aria-label="تاريخ تسجيل الحالة" type="date" id="f-reg-date" class="w-full bg-transparent dark:text-white outline-none text-sm font-sans">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <select aria-label="هل تم استبيان الحالة؟" id="f-is-surveyed" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">هل تم استبيان الحالة؟</option>
                            <option value="نعم">نعم</option>
                            <option value="لا">لا</option>
                        </select>
                        <input aria-label="تاريخ الاستبيان" type="date" id="f-survey-date" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input aria-label="اسم الباحث أو جامع البيانات" type="text" id="f-researcher" placeholder="اسم الباحث" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                        <input aria-label="الجهة المستبينة" type="text" id="f-survey-entity" placeholder="الجهة المستبينة" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                    </div>
                    <textarea aria-label="ملاحظات الباحث" id="f-researcher-notes" placeholder="ملاحظات الباحث" rows="2" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary resize-none"></textarea>
                </div>

                <div id="form-step-3" class="space-y-4 hidden">
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <input aria-label="عدد أفراد الأسرة" type="tel" inputmode="numeric" id="f-fam-size" placeholder="عدد أفراد الأسرة" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input aria-label="عدد الأطفال" type="tel" inputmode="numeric" id="f-kids-count" placeholder="عدد الأطفال" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input aria-label="عدد الأيتام" type="tel" inputmode="numeric" id="f-orphans-count" placeholder="عدد الأيتام" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                    </div>
                    <textarea aria-label="أسماء الأطفال" id="f-kids-names" placeholder="أسماء الأطفال" rows="2" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary resize-none"></textarea>
                    <textarea aria-label="سنة تولد الأطفال" id="f-kids-births" placeholder="سنة تولد الأطفال" rows="2" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary resize-none"></textarea>
                    
                    <div class="grid grid-cols-2 gap-3">
                        <select aria-label="هل توجد أرملة أو مطلقة في الأسرة؟" id="f-has-widow" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">يوجد أرملة/مطلقة؟</option>
                            <option value="نعم">نعم</option>
                            <option value="لا">لا</option>
                        </select>
                        <select aria-label="هل توجد إعاقة في الأسرة؟" id="f-has-disability" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">توجد إعاقة؟</option>
                            <option value="نعم">نعم</option>
                            <option value="لا">لا</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <input aria-label="عدد ذوي الإعاقة في الأسرة" type="tel" inputmode="numeric" id="f-disability-count" placeholder="عدد ذوي الإعاقة" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <select aria-label="هل توجد أمراض مزمنة في الأسرة؟" id="f-has-disease" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">أمراض مزمنة؟</option>
                            <option value="نعم">نعم</option>
                            <option value="لا">لا</option>
                        </select>
                        <input aria-label="نوع المرض المزمن" type="text" id="f-disease-type" placeholder="نوع المرض" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                    </div>
                </div>

                <div id="form-step-4" class="space-y-4 hidden">

            "f-name": "الاسم الثلاثي واللقب", "f-marital": "الحالة الزوجية", "f-spouse": "اسم الزوج/الزوجة", "f-nid": "رقم البطاقة الوطنية", "f-ration": "البطاقة التموينية", "f-residence": "بطاقة السكن", "f-phone1": "رقم الهاتف", "f-phone2": "رقم هاتف ثاني", "f-address": "العنوان", "f-nearest": "أقرب نقطة دالة", "f-mukhtar": "اسم المختار",

        ];

        window.addEventListener('DOMContentLoaded', () => {
            const checkAuthInterval = setInterval(() => {
                if(window.auth && window.firebaseFns) {
                    clearInterval(checkAuthInterval);
                    window.firebaseFns.onAuthStateChanged(window.auth, (user) => {
                        if(user) {
                            document.getElementById('auth-screen').classList.add('hidden');
                            loadDataFromFirebase();
                        } else {
                            document.getElementById('auth-screen').classList.remove('hidden');
                        }
                    });
                }
            }, 200);
        });

        async function handleLogin() {
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value;
            const errBox = document.getElementById('auth-error');
            errBox.classList.add('hidden');
            try {
                await window.firebaseFns.signInWithEmailAndPassword(window.auth, email, password);
            } catch (err) {
                errBox.innerText = 'خطأ في البريد أو كلمة المرور';
                errBox.classList.remove('hidden');
            }
        }

        async function handleLogout() {
            try {
                await window.firebaseFns.signOut(window.auth);
            } catch(e) {}
        }

        async function loadDataFromFirebase() {
            try {
                const querySnapshot = await window.firebaseFns.getDocs(window.firebaseFns.collection(window.db, "families"));
                families = [];
                querySnapshot.forEach((docSnap) => {
                    families.push({ id: docSnap.id, ...docSnap.data() });
                });
            } catch(e) {
                families = [];
            }
            renderFamilies();
            renderMessages();
        }

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1) || 'main';
            const modals = ['form-modal', 'fam-options-modal', 'details-modal', 'aid-modal', 'aid-options-modal', 'action-modal'];
            
            modals.forEach(m => document.getElementById(m).classList.add('hidden'));

            if (modals.includes(hash)) {
                if (hash === 'aid-modal' || hash === 'aid-options-modal') {
                    document.getElementById('details-modal').classList.remove('hidden');
                }
                document.getElementById(hash).classList.remove('hidden');
            } else {
                if (['main', 'fav', 'messages', 'settings'].includes(hash)) {
                    executeTabSwitch(hash);
                } else {
                    executeTabSwitch('main');
                }
            }
        });

        function navigateTo(hash) {
            window.location.hash = hash;
        }

        function executeTabSwitch(tab) {
            document.getElementById('view-main').classList.add('hidden');
            document.getElementById('view-fav').classList.add('hidden');
            document.getElementById('view-messages').classList.add('hidden');
            document.getElementById('view-settings').classList.add('hidden');
            
            document.getElementById('tab-main').className = "flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all";
            document.getElementById('tab-fav').className = "flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all";
            document.getElementById('tab-messages').className = "flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all";
            document.getElementById('tab-settings').className = "flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all";
            
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            document.getElementById(`tab-${tab}`).className = "flex-1 py-4 text-center font-bold border-b-4 border-white transition-all";
            
            if(tab === 'settings' || tab === 'messages') {
                document.getElementById('search-container').classList.add('hidden');
            } else {
                document.getElementById('search-container').classList.remove('hidden');
                renderFamilies();
            }
        }

        function toggleTheme() {
            if(document.getElementById('dark-mode-toggle').checked) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        function changeFontSize(size) {
            document.documentElement.style.fontSize = size;
        }

        function renderFamilies() {
            const listDiv = document.getElementById('families-list');
            const favDiv = document.getElementById('fav-list');
            const emptyState = document.getElementById('empty-state');
            const query = (document.getElementById('search-input').value || '').toLowerCase();

            listDiv.innerHTML = '';
            favDiv.innerHTML = '';

            let filtered = families.filter(f => !f.deleted && (f.data['f-name'] || '').toLowerCase().includes(query));
            let favs = families.filter(f => f.fav && !f.deleted);

            if(families.filter(f => !f.deleted).length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.forEach(f => listDiv.innerHTML += createCard(f));
            favs.forEach(f => favDiv.innerHTML += createCard(f));

            if(favs.length === 0 && !document.getElementById('view-fav').classList.contains('hidden')) {
                favDiv.innerHTML = '<div class="text-center mt-20 text-slate-400"><i aria-hidden="true" class="fa-solid fa-star text-5xl mb-4 text-slate-200 dark:text-slate-700"></i><p class="font-bold">لا توجد عوائل في المفضلة</p></div>';
            }
        }

        function renderMessages() {
            const msgDiv = document.getElementById('messages-list');
            msgDiv.innerHTML = '';
            messages.forEach(m => {
                msgDiv.innerHTML += `
                    <div class="bg-white dark:bg-darkCard p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-2 transition-colors">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-slate-800 dark:text-white text-base">${m.title}</h3>
                            <span class="text-xs text-slate-400 font-sans">${m.date}</span>
                        </div>
                        <p class="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">${m.text}</p>
                        <div class="text-xs text-primary dark:text-indigo-400 font-bold pt-1">المرسل: ${m.sender}</div>
                    </div>
                `;
            });
        }

        function createCard(f) {
            const favBadge = f.fav ? '<i aria-hidden="true" class="fa-solid fa-star text-yellow-400 absolute top-5 right-4 text-xs"></i>' : '';
            const pendingTag = f.pendingDelete ? '<span class="bg-red-100 dark:bg-red-900/50 text-red-600 dark:text-red-400 text-[10px] px-2 py-1 rounded-full font-bold ml-2">قيد الحذف</span>' : '';
            return `
                <div class="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 relative flex items-center p-2 pr-4 transition-colors">
                    ${favBadge}
                    <div class="flex-1 py-3 cursor-pointer pl-2 ${f.fav ? 'pr-5' : ''}" onclick="openDetails('${f.id}')">
                        <h3 class="font-bold text-slate-800 dark:text-white flex items-center">${f.data['f-name'] || 'بدون اسم'} ${pendingTag}</h3>
                    </div>
                    <button aria-label="خيارات العائلة" onclick="openFamOptions('${f.id}')" class="w-12 h-12 flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">
                        <i aria-hidden="true" class="fa-solid fa-ellipsis-vertical text-lg"></i>
                    </button>
                </div>
            `;
        }

        function openFamOptions(id) {
            activeFamilyId = id;
            navigateTo('fam-options-modal');
        }

        function toggleFavAction() {
            const f = families.find(x => x.id === activeFamilyId);
            if(f) {
                f.fav = !f.fav;
                updateFamilyInFirebase(f);
            }
            history.back();
            renderFamilies();
        }

        function openReportAction() {
            history.back();
            setTimeout(() => {
                document.getElementById('action-type').value = 'report';
                document.getElementById('action-reason').value = '';
                document.getElementById('action-title').innerText = 'إبلاغ عن العائلة';
                navigateTo('action-modal');
            }, 100);
        }

        function openDeleteAction() {
            history.back();
            setTimeout(() => {
                document.getElementById('action-type').value = 'delete';
                document.getElementById('action-reason').value = '';
                document.getElementById('action-title').innerText = 'تأكيد طلب الحذف';
                navigateTo('action-modal');
            }, 100);
        }

        async function submitAction() {
            const type = document.getElementById('action-type').value;
            const f = families.find(x => x.id === activeFamilyId);
            if(f && type === 'delete') {
                f.pendingDelete = true;
                await updateFamilyInFirebase(f);
            }
            history.back();
            renderFamilies();
        }

        function openFormStep(step) {
            formStep = step;
            updateFormStepView();
            if(step === 1 && !document.getElementById('f-id').value) {
                formFields.forEach(id => document.getElementById(id).value = '');
                document.getElementById('form-title').innerText = 'إضافة عائلة جديدة';
            }
        }

        function changeFormStep(dir) {
            formStep += dir;
            if(formStep < 1) formStep = 1;
            if(formStep > 4) formStep = 4;
            updateFormStepView();
        }

        function updateFormStepView() {
            for(let i=1; i<=4; i++) {
                document.getElementById(`form-step-${i}`).classList.add('hidden');
                document.getElementById(`step-ind-${i}`).className = "flex-1 py-3 text-xs transition-colors " + (formStep === i ? "bg-primary text-white font-bold" : "text-slate-500 dark:text-slate-400");
            }
            document.getElementById(`form-step-${formStep}`).classList.remove('hidden');

            document.getElementById('btn-prev').style.display = formStep === 1 ? 'none' : 'block';
            document.getElementById('btn-next').style.display = formStep === 4 ? 'none' : 'block';
            
            const isEditing = document.getElementById('f-id').value !== '';
            document.getElementById('btn-save').style.display = (formStep === 4 || isEditing) ? 'block' : 'none';
        }

        async function saveFamily() {
            const id = document.getElementById('f-id').value;
            const name = document.getElementById('f-name').value.trim();
            if(!name) { alert('الاسم مطلوب'); return; }

            let famData = {};
            formFields.forEach(field => famData[field] = document.getElementById(field).value);

            if(id) {
                const idx = families.findIndex(x => x.id === id);
                if(idx > -1) {
                    families[idx].data = famData;
                    await updateFamilyInFirebase(families[idx]);
                }
            } else {
                const newFam = {
                    data: famData,
                    fav: false, pendingDelete: false, deleted: false,
                    aidRecords: {}
                };
                try {
                    const docRef = await window.firebaseFns.addDoc(window.firebaseFns.collection(window.db, "families"), newFam);
                    newFam.id = docRef.id;
                    families.unshift(newFam);
                } catch(e) {}
            }
            
            history.back();
            
            setTimeout(() => {
                if(window.location.hash === '#details-modal' || activeFamilyId === id) {
                    openDetails(id || families[0].id);
                } else {
                    renderFamilies();
                }
            }, 100);
        }

        async function updateFamilyInFirebase(famObj) {
            try {
                const docRef = window.firebaseFns.doc(window.db, "families", famObj.id);
                await window.firebaseFns.updateDoc(docRef, {
                    data: famObj.data,
                    fav: famObj.fav,
                    pendingDelete: famObj.pendingDelete,
                    aidRecords: famObj.aidRecords
                });
            } catch(e) {}
        }

        function openDetails(id) {
            activeFamilyId = id;
            const f = families.find(x => x.id === id);
            if(!f) return;
            
            document.getElementById('details-title').innerText = f.data['f-name'] || 'تفاصيل العائلة';
            switchDetailsTab('info');
            changeDetailsPage(0, 1);
            navigateTo('details-modal');
        }

        function switchDetailsTab(tab) {
            if(tab === 'info') {
                document.getElementById('d-view-info').classList.remove('hidden');
                document.getElementById('d-view-history').classList.add('hidden');
                document.getElementById('d-tab-info').className = "flex-1 py-4 text-primary dark:text-indigo-400 font-bold border-b-2 border-primary dark:border-indigo-400 text-sm transition-colors";
                document.getElementById('d-tab-history').className = "flex-1 py-4 text-slate-500 dark:text-slate-400 font-bold border-b-2 border-transparent text-sm transition-colors";
            } else {
                document.getElementById('d-view-info').classList.add('hidden');
                document.getElementById('d-view-history').classList.remove('hidden');
                document.getElementById('d-tab-history').className = "flex-1 py-4 text-primary dark:text-indigo-400 font-bold border-b-2 border-primary dark:border-indigo-400 text-sm transition-colors";
                document.getElementById('d-tab-info').className = "flex-1 py-4 text-slate-500 dark:text-slate-400 font-bold border-b-2 border-transparent text-sm transition-colors";
                document.getElementById('current-month-display').innerText = `${monthsNames[currentMonth]} ${currentYear}`;
                renderAidTable();
            }
        }

        function changeDetailsPage(dir, absolutePage = null) {
            if(absolutePage) detailsPage = absolutePage;
            else detailsPage += dir;

            if(detailsPage < 1) detailsPage = 1;
            if(detailsPage > 4) detailsPage = 4;

            const f = families.find(x => x.id === activeFamilyId);
            if(!f) return;

            let html = '';
            pageFields[detailsPage - 1].forEach(field => {
                const val = f.data[field] || '-';
                html += `
                    <div>
                        <span class="text-xs text-slate-400 dark:text-slate-500 block mb-1">${fieldLabels[field]}</span>
                        <div class="font-bold text-slate-800 dark:text-slate-100 text-sm leading-relaxed">${val}</div>
                    </div>
                `;
            });

            document.getElementById('d-info-content').innerHTML = html;
            
            document.getElementById('d-btn-prev').style.visibility = detailsPage === 1 ? 'hidden' : 'visible';
            document.getElementById('d-btn-next').style.visibility = detailsPage === 4 ? 'hidden' : 'visible';
        }

        function editCurrentDetailsPage() {
            const f = families.find(x => x.id === activeFamilyId);
            if(!f) return;
            
            document.getElementById('f-id').value = f.id;
            formFields.forEach(field => {
                document.getElementById(field).value = f.data[field] || '';
            });
            document.getElementById('form-title').innerText = 'تعديل بيانات العائلة';
            
            navigateTo('form-modal');
            openFormStep(detailsPage);
        }

        function changeMonth(dir) {
            currentMonth += dir;
            if(currentMonth > 12) { currentMonth = 1; currentYear++; }
            else if(currentMonth < 1) { currentMonth = 12; currentYear--; }

            const nextBtn = document.getElementById('btn-next-month');
            if(currentYear >= 2026 && currentMonth >= 7) {
                currentYear = 2026; currentMonth = 7;
                nextBtn.disabled = true;
            } else {
                nextBtn.disabled = false;
            }
            document.getElementById('current-month-display').innerText = `${monthsNames[currentMonth]} ${currentYear}`;
            renderAidTable();
        }

        function renderAidTable() {
            const container = document.getElementById('aid-content-container');
            const f = families.find(x => x.id === activeFamilyId);
            if(!f) return;
            const key = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
            const records = f.aidRecords && f.aidRecords[key] ? f.aidRecords[key] : [];

            if(records.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 text-slate-400 transition-colors">
                        <div class="w-16 h-16 bg-slate-50 dark:bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-3">
                            <i aria-hidden="true" class="fa-solid fa-box-open text-3xl text-slate-300 dark:text-slate-600"></i>
                        </div>
                        <p class="text-sm font-bold text-slate-500 dark:text-slate-400">لا توجد أية مساعدة في هذا الشهر</p>
                    </div>
                `;
            } else {
                let html = '';
                records.forEach(r => {
                    const statusColor = r.status === 'تم تلبيتها' ? 'text-emerald-500' : 'text-orange-500';
                    html += `
                        <div class="bg-white dark:bg-darkCard p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 flex justify-between items-center transition-colors">
                            <div>
                                <div class="font-bold text-slate-800 dark:text-white mb-1">${r.type} <span class="text-xs ${statusColor} ml-2">(${r.status})</span></div>
                                <div class="text-xs text-slate-500 dark:text-slate-400"><i aria-hidden="true" class="fa-solid fa-user-circle mr-1"></i> ${r.volunteer} &nbsp;&nbsp;|&nbsp;&nbsp; <span class="font-sans">${r.date}</span></div>
                            </div>
                            <button aria-label="خيارات المساعدة" onclick="openAidOptions('${r.id}')" class="w-10 h-10 flex items-center justify-center text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl transition-colors">
                                <i aria-hidden="true" class="fa-solid fa-ellipsis-vertical"></i>
                            </button>
                        </div>
                    `;
                });
                container.innerHTML = html;
            }
        }

        function openAddAidModal(aidId = null) {
            activeAidId = aidId;
            document.getElementById('aid-id-input').value = aidId || '';
            if(aidId) {
                document.getElementById('aid-modal-title').innerText = 'تعديل المساعدة';
                const f = families.find(x => x.id === activeFamilyId);
                const key = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
                const aid = f.aidRecords[key].find(x => x.id === aidId);
                if(aid) {
                    document.getElementById('aid-volunteer').value = aid.volunteer;
                    document.getElementById('aid-type').value = aid.type;
                    document.getElementById('aid-status').value = aid.status || 'تم تلبيتها';
                }
            } else {
                document.getElementById('aid-modal-title').innerText = 'إضافة مساعدة';
                document.getElementById('aid-volunteer').value = '';
                document.getElementById('aid-type').value = '';
                document.getElementById('aid-status').value = 'تم تلبيتها';
            }
        }

        async function saveAid() {
            const volunteer = document.getElementById('aid-volunteer').value;
            const type = document.getElementById('aid-type').value;
            const status = document.getElementById('aid-status').value;
            const aidId = document.getElementById('aid-id-input').value;
            if(!volunteer || !type) return;

            const f = families.find(x => x.id === activeFamilyId);
            if(f) {
                const key = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
                if(!f.aidRecords) f.aidRecords = {};
                if(!f.aidRecords[key]) f.aidRecords[key] = [];
                
                if(aidId) {
                    const aidIndex = f.aidRecords[key].findIndex(x => x.id === aidId);
                    if(aidIndex > -1) {
                        f.aidRecords[key][aidIndex].volunteer = volunteer;
                        f.aidRecords[key][aidIndex].type = type;
                        f.aidRecords[key][aidIndex].status = status;
                    }
                } else {
                    f.aidRecords[key].push({
                        id: 'aid_' + Date.now(),
                        date: new Date().toISOString().split('T')[0].replaceAll('-', '/'),
                        volunteer, type, status
                    });
                }
                await updateFamilyInFirebase(f);
            }
            history.back();
            renderAidTable();
        }

        function openAidOptions(aidId) {
            activeAidId = aidId;
            navigateTo('aid-options-modal');
        }

        function editAidAction() {
            history.back();
            setTimeout(() => {
                navigateTo('aid-modal');
                openAddAidModal(activeAidId);
            }, 100);
        }

        async function deleteAidAction() {
            const f = families.find(x => x.id === activeFamilyId);
            if(f) {
                const key = `${currentYear}-${String(currentMonth).padStart(2,'0')}`;
                if(f.aidRecords && f.aidRecords[key]) {
                    f.aidRecords[key] = f.aidRecords[key].filter(x => x.id !== activeAidId);
                    await updateFamilyInFirebase(f);
                }
            }
            history.back();
            renderAidTable();
        }

        window.onload = function() {
            if(!window.location.hash) {
                window.location.hash = 'main';
            }
        };
    </script>
</body>
</html>
