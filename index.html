<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة العوائل والمساعدات الخيرية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#6366f1', secondary: '#8b5cf6', darkBg: '#0f172a', darkCard: '#1e293b' }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap');
        body { font-family: 'Cairo', sans-serif; transition: background-color 0.3s, color 0.3s; }
        html { font-size: 16px; transition: font-size 0.3s; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        .glass-effect { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-darkBg text-slate-800 dark:text-slate-100 h-screen flex flex-col overflow-hidden">

    <div id="login-screen" class="fixed inset-0 bg-slate-50 dark:bg-darkBg z-[100] flex flex-col justify-center items-center p-4">
        <div class="bg-white dark:bg-darkCard p-8 rounded-3xl shadow-xl w-full max-w-sm text-center border border-slate-100 dark:border-slate-800">
            <div class="w-20 h-20 bg-primary/10 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-hands-holding-child text-4xl text-primary"></i>
            </div>
            <h1 class="text-2xl font-bold mb-2">نظام إدارة العوائل</h1>
            <p class="text-slate-500 dark:text-slate-400 mb-8 text-sm">يرجى تسجيل الدخول للمتابعة</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-3 shadow-sm hover:bg-slate-50 dark:hover:bg-slate-700 transition-colors">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                تسجيل الدخول بواسطة جوجل
            </button>
        </div>
    </div>

    <div id="pending-screen" class="fixed inset-0 bg-slate-50 dark:bg-darkBg z-[100] hidden flex flex-col justify-center items-center p-4">
        <div class="bg-white dark:bg-darkCard p-8 rounded-3xl shadow-xl w-full max-w-sm text-center border border-slate-100 dark:border-slate-800">
            <div class="w-20 h-20 bg-orange-100 dark:bg-orange-900/30 rounded-full flex items-center justify-center mx-auto mb-6">
                <i class="fa-solid fa-hourglass-half text-4xl text-orange-500"></i>
            </div>
            <h2 class="text-xl font-bold mb-3">حسابك قيد المراجعة</h2>
            <p class="text-slate-500 dark:text-slate-400 text-sm mb-6">يرجى انتظار موافقة المشرف على حسابك للتمكن من الدخول إلى النظام.</p>
            <button onclick="logout()" class="text-slate-400 hover:text-red-500 text-sm font-bold transition-colors">تسجيل الخروج</button>
        </div>
    </div>

    <div id="app-content" class="hidden flex-col h-screen w-full">
        <nav class="bg-gradient-to-r from-primary to-secondary text-white shadow-lg z-10 flex-shrink-0">
            <div class="max-w-xl mx-auto flex justify-between relative">
                <button onclick="navigateTo('main')" id="tab-main" class="flex-1 py-4 text-center font-bold border-b-4 border-white transition-all">الرئيسية</button>
                <button onclick="navigateTo('fav')" id="tab-fav" class="flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all">المفضلة</button>
                <button onclick="navigateTo('settings')" id="tab-settings" class="flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all">الإعدادات</button>
            </div>
        </nav>

        <div id="search-container" class="bg-white dark:bg-darkCard p-3 shadow-sm z-10 flex-shrink-0 transition-colors">
            <div class="max-w-xl mx-auto flex gap-3 items-center">
                <div class="relative flex-1">
                    <input type="text" id="search-input" onkeyup="renderFamilies()" placeholder="ابحث بالاسم الثلاثي..." class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white border-none rounded-2xl py-3 px-10 focus:ring-2 focus:ring-primary outline-none text-sm transition-colors">
                    <i class="fa-solid fa-search absolute right-4 top-3.5 text-slate-400"></i>
                </div>
                <button onclick="navigateTo('form-modal'); openFormStep(1);" class="bg-gradient-to-r from-primary to-secondary hover:opacity-90 text-white px-5 py-3 rounded-2xl font-bold text-sm shadow-md transition-all flex items-center gap-2 flex-shrink-0">
                    <i class="fa-solid fa-plus"></i> إضافة
                </button>
            </div>
        </div>

        <main class="flex-1 overflow-y-auto p-4 hide-scroll relative">
            <div id="view-main" class="max-w-xl mx-auto space-y-4">
                <div id="empty-state" class="hidden flex flex-col items-center justify-center mt-32 text-slate-400">
                    <div class="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4 shadow-inner">
                        <i class="fa-solid fa-users text-4xl text-slate-300 dark:text-slate-600"></i>
                    </div>
                    <h2 class="text-xl font-bold text-slate-500 dark:text-slate-400">لا توجد عوائل مسجلة</h2>
                </div>
                <div id="families-list" class="space-y-3 pb-20"></div>
            </div>

            <div id="view-fav" class="max-w-xl mx-auto space-y-3 hidden pb-20">
                <div id="fav-list" class="space-y-3"></div>
            </div>

            <div id="view-settings" class="max-w-xl mx-auto hidden space-y-4 pb-20">
                <div class="bg-white dark:bg-darkCard p-5 rounded-3xl shadow-sm border border-slate-100 dark:border-slate-800 transition-colors mt-4">
                    <div class="flex items-center gap-4 border-b border-slate-100 dark:border-slate-700 pb-4 mb-4">
                        <div class="w-12 h-12 bg-primary text-white rounded-full flex justify-center items-center text-lg font-bold" id="user-avatar"></div>
                        <div>
                            <h3 class="font-bold text-sm" id="user-name-display"></h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400" id="user-email-display"></p>
                        </div>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-slate-100 dark:border-slate-700">
                        <span class="font-bold text-sm">الوضع الليلي</span>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="dark-mode-toggle" class="sr-only peer" onchange="toggleTheme()">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:translate-x-[-100%] rtl:peer-checked:after:-translate-x-full after:content-[''] after:absolute after:top-[2px] after:right-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-slate-600 peer-checked:bg-primary"></div>
                        </label>
                    </div>
                    <div class="flex justify-between items-center py-3 border-b border-slate-100 dark:border-slate-700">
                        <span class="font-bold text-sm">حجم الخط</span>
                        <select id="font-size-select" onchange="changeFontSize(this.value)" class="bg-slate-100 dark:bg-slate-800 dark:text-white px-4 py-2 rounded-xl text-sm outline-none border-none focus:ring-2 focus:ring-primary">
                            <option value="14px">صغير</option>
                            <option value="16px" selected>متوسط</option>
                            <option value="18px">كبير</option>
                        </select>
                    </div>
                    <button id="admin-panel-btn" onclick="openAdminModal()" class="w-full hidden items-center gap-3 bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl text-slate-700 dark:text-slate-200 font-bold transition-colors mt-3">
                        <div class="w-8 h-8 rounded-full bg-primary/20 text-primary flex items-center justify-center"><i class="fa-solid fa-users-cog"></i></div>
                        إدارة المتطوعين
                    </button>
                    <button onclick="logout()" class="w-full mt-4 bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-400 font-bold py-3 rounded-xl text-sm transition-colors">
                        تسجيل الخروج
                    </button>
                </div>
            </div>
        </main>
    </div>

    <div id="form-modal" class="fixed inset-0 bg-black/60 glass-effect z-50 hidden flex justify-center items-end sm:items-center transition-opacity">
        <div class="bg-white dark:bg-darkCard w-full sm:max-w-2xl h-[92vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-900">
                <h2 id="form-title" class="text-lg font-bold text-primary dark:text-indigo-400">إضافة عائلة جديدة</h2>
                <button onclick="history.back()" class="text-slate-400 hover:text-red-500 bg-slate-200 dark:bg-slate-800 rounded-full w-8 h-8 flex justify-center items-center transition-colors"><i class="fa-solid fa-times"></i></button>
            </div>
            
            <div class="bg-yellow-50 dark:bg-yellow-900/20 p-2 text-center text-xs font-bold text-yellow-700 dark:text-yellow-500" id="volunteer-indicator"></div>

            <div class="flex bg-slate-100 dark:bg-slate-800 border-b dark:border-slate-700 text-xs font-bold text-center">
                <div id="step-ind-1" class="flex-1 py-3 bg-primary text-white">1. الأساسية</div>
                <div id="step-ind-2" class="flex-1 py-3 text-slate-500 dark:text-slate-400">2. التصنيف</div>
                <div id="step-ind-3" class="flex-1 py-3 text-slate-500 dark:text-slate-400">3. الأسرة</div>
                <div id="step-ind-4" class="flex-1 py-3 text-slate-500 dark:text-slate-400">4. المعيشة</div>
            </div>

            <div class="flex-1 overflow-y-auto p-5 space-y-4">
                <input type="hidden" id="f-id">
                
                <div id="form-step-1" class="space-y-4">
                    <input type="text" id="f-name" placeholder="الاسم الثلاثي واللقب" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                    <div class="grid grid-cols-2 gap-3">
                        <select id="f-marital" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">الحالة الزوجية</option><option value="متزوج">متزوج</option><option value="أعزب">أعزب</option><option value="أرمل">أرمل</option><option value="مطلق">مطلق</option>
                        </select>
                        <input type="text" id="f-spouse" placeholder="اسم الزوج/الزوجة" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                    </div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <input type="tel" inputmode="numeric" id="f-nid" placeholder="البطاقة الوطنية" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input type="tel" inputmode="numeric" id="f-ration" placeholder="البطاقة التموينية" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input type="tel" inputmode="numeric" id="f-residence" placeholder="بطاقة السكن" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="tel" inputmode="numeric" id="f-phone1" placeholder="رقم الهاتف" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input type="tel" inputmode="numeric" id="f-phone2" placeholder="هاتف ثاني" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                    </div>
                    <textarea id="f-address" placeholder="العنوان" rows="2" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary resize-none"></textarea>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="f-nearest" placeholder="أقرب نقطة دالة" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                        <input type="text" id="f-mukhtar" placeholder="اسم المختار" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                    </div>
                </div>

                <div id="form-step-2" class="space-y-4 hidden">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <select id="f-category" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">صنف الحالة</option><option value="متعفف">متعفف</option><option value="أرملة">أرملة</option><option value="أيتام">أيتام</option><option value="ذوي إعاقة">ذوي إعاقة</option><option value="مطلقة">مطلقة</option><option value="كبير السن">كبير السن</option><option value="أخرى">أخرى</option>
                        </select>
                        <select id="f-need-level" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">مستوى الحاجة</option><option value="معدوم الدخل">معدوم الدخل</option><option value="شديد">شديد</option><option value="متوسط">متوسط</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <select id="f-priority" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">الأولوية</option><option value="عاجلة جدا">عاجلة جداً</option><option value="عاجلة">عاجلة</option><option value="متوسطة">متوسطة</option>
                        </select>
                        <div class="flex items-center gap-2 bg-slate-100 dark:bg-slate-800 p-3 rounded-xl">
                            <span class="text-sm text-slate-500">التسجيل:</span>
                            <input type="date" id="f-reg-date" class="w-full bg-transparent dark:text-white outline-none text-sm font-sans">
                        </div>
                    </div>
                    <textarea id="f-researcher-notes" placeholder="ملاحظات الباحث" rows="2" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary resize-none"></textarea>
                </div>

                <div id="form-step-3" class="space-y-4 hidden">
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                        <input type="tel" inputmode="numeric" id="f-fam-size" placeholder="عدد الأفراد" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input type="tel" inputmode="numeric" id="f-kids-count" placeholder="عدد الأطفال" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                        <input type="tel" inputmode="numeric" id="f-orphans-count" placeholder="عدد الأيتام" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="f-has-disability" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">توجد إعاقة؟</option><option value="نعم">نعم</option><option value="لا">لا</option>
                        </select>
                        <select id="f-has-disease" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">أمراض مزمنة؟</option><option value="نعم">نعم</option><option value="لا">لا</option>
                        </select>
                    </div>
                </div>

                <div id="form-step-4" class="space-y-4 hidden">
                    <div class="grid grid-cols-2 gap-3">
                        <input type="text" id="f-income-source" placeholder="مصدر الدخل" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                        <input type="tel" inputmode="numeric" id="f-income-amount" placeholder="الدخل الشهري" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary font-sans">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <select id="f-housing-type" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">نوع السكن</option><option value="ملك">ملك</option><option value="إيجار">إيجار</option><option value="تجاوز">تجاوز</option>
                        </select>
                        <select id="f-housing-condition" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary">
                            <option value="">حالة السكن</option><option value="جيد">جيد</option><option value="متوسط">متوسط</option><option value="متردي">متردي</option>
                        </select>
                    </div>
                    <textarea id="f-key-needs" placeholder="أبرز الاحتياجات" rows="2" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white p-3 rounded-xl outline-none text-sm focus:ring-2 focus:ring-primary resize-none"></textarea>
                </div>
            </div>

            <div class="p-4 border-t dark:border-slate-700 bg-slate-50 dark:bg-slate-900 flex justify-between">
                <button type="button" id="btn-prev" onclick="changeFormStep(-1)" class="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold px-6 py-2.5 rounded-xl text-sm hidden transition-colors">السابق</button>
                <div class="mr-auto flex gap-2">
                    <button type="button" id="btn-next" onclick="changeFormStep(1)" class="bg-primary hover:bg-secondary text-white font-bold px-6 py-2.5 rounded-xl text-sm transition-colors">التالي</button>
                    <button type="button" id="btn-save" onclick="saveFamily()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-xl text-sm hidden transition-colors">حفظ</button>
                </div>
            </div>
        </div>
    </div>

    <div id="fam-options-modal" class="fixed inset-0 bg-black/50 z-[60] hidden flex flex-col justify-end">
        <div class="bg-white dark:bg-darkCard w-full rounded-t-3xl p-5 shadow-2xl transform transition-transform">
            <div class="flex justify-between items-center mb-5 border-b dark:border-slate-700 pb-3">
                <h3 class="font-bold text-lg">خيارات العائلة</h3>
                <button onclick="history.back()" class="text-slate-400 bg-slate-100 dark:bg-slate-800 rounded-full w-8 h-8"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="space-y-3">
                <button onclick="toggleFavAction()" class="w-full flex items-center gap-3 bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl text-slate-700 dark:text-slate-200 font-bold transition-colors">
                    <div class="w-10 h-10 rounded-full bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 flex items-center justify-center text-lg"><i class="fa-solid fa-star"></i></div>
                    إضافة / إزالة من المفضلة
                </button>
                <button onclick="openReportAction()" class="w-full flex items-center gap-3 bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl text-slate-700 dark:text-slate-200 font-bold transition-colors">
                    <div class="w-10 h-10 rounded-full bg-orange-100 dark:bg-orange-900/30 text-orange-600 flex items-center justify-center text-lg"><i class="fa-solid fa-bullhorn"></i></div>
                    إبلاغ للإدارة
                </button>
                <button onclick="openDeleteAction()" class="w-full flex items-center gap-3 bg-red-50 dark:bg-red-900/20 p-4 rounded-2xl text-red-600 font-bold transition-colors">
                    <div class="w-10 h-10 rounded-full bg-red-100 dark:bg-red-900/50 flex items-center justify-center text-lg"><i class="fa-solid fa-trash"></i></div>
                    طلب حذف العائلة
                </button>
            </div>
        </div>
    </div>

    <div id="details-modal" class="fixed inset-0 bg-black/60 glass-effect z-40 hidden flex flex-col justify-end sm:justify-center items-center">
        <div class="bg-white dark:bg-darkCard w-full sm:max-w-xl h-[95vh] rounded-t-3xl sm:rounded-3xl flex flex-col overflow-hidden shadow-2xl">
            <header class="bg-gradient-to-r from-primary to-secondary text-white p-4 flex justify-between items-center relative">
                <h2 class="text-lg font-bold truncate pr-2 w-3/4" id="details-title"></h2>
                <button onclick="history.back()" class="bg-white/20 hover:bg-white/30 text-sm px-4 py-2 rounded-xl font-bold transition-colors"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
            </header>
            
            <div class="flex bg-slate-50 dark:bg-slate-900 border-b dark:border-slate-700 overflow-x-auto hide-scroll text-sm">
                <button onclick="switchDetailsTab('info')" id="d-tab-info" class="flex-1 py-4 text-primary dark:text-indigo-400 font-bold border-b-2 border-primary dark:border-indigo-400 whitespace-nowrap px-4">التفاصيل</button>
                <button onclick="switchDetailsTab('history')" id="d-tab-history" class="flex-1 py-4 text-slate-500 dark:text-slate-400 font-bold border-b-2 border-transparent whitespace-nowrap px-4">سجل المساعدات</button>
                <button onclick="switchDetailsTab('changes')" id="d-tab-changes" class="flex-1 py-4 text-slate-500 dark:text-slate-400 font-bold border-b-2 border-transparent whitespace-nowrap px-4">سجل التعديلات</button>
            </div>
            
            <div class="flex-1 overflow-y-auto bg-slate-100 dark:bg-darkBg p-4">
                <div id="d-view-info" class="flex flex-col h-full">
                    <div id="d-info-content" class="bg-white dark:bg-darkCard p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 space-y-4 flex-1 overflow-y-auto"></div>
                    <div class="flex justify-between items-center mt-4 border-t dark:border-slate-700 pt-4">
                        <button id="d-btn-prev" onclick="changeDetailsPage(-1)" class="bg-slate-200 dark:bg-slate-700 px-4 py-2 rounded-xl text-sm font-bold"><i class="fa-solid fa-arrow-right"></i> السابق</button>
                        <button onclick="editCurrentDetailsPage()" class="bg-slate-800 dark:bg-slate-700 text-white font-bold px-6 py-2 rounded-xl text-sm"><i class="fa-solid fa-pen"></i> تعديل</button>
                        <button id="d-btn-next" onclick="changeDetailsPage(1)" class="bg-primary text-white font-bold px-4 py-2 rounded-xl text-sm">التالي <i class="fa-solid fa-arrow-left"></i></button>
                    </div>
                </div>

                <div id="d-view-history" class="hidden space-y-4">
                    <div id="aid-content-container" class="space-y-3"></div>
                    <button onclick="openAddAidModal()" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-4 rounded-2xl text-sm shadow-md mt-4"><i class="fa-solid fa-plus"></i> إضافة مساعدة</button>
                </div>

                <div id="d-view-changes" class="hidden space-y-3">
                    <div id="changes-content-container" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="aid-modal" class="fixed inset-0 bg-black/60 glass-effect z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">إضافة مساعدة</h3>
            <input type="text" id="aid-type" placeholder="نوع المساعدة" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl mb-3 text-sm">
            <select id="aid-status" class="w-full bg-slate-100 dark:bg-slate-800 p-4 rounded-xl mb-4 text-sm">
                <option value="تم تلبيتها">تم تلبيتها</option>
                <option value="لم يتم تلبيتها">لم يتم تلبيتها</option>
            </select>
            <div class="flex gap-3">
                <button onclick="saveAid()" class="flex-1 bg-primary text-white font-bold py-3 rounded-xl text-sm">حفظ</button>
                <button onclick="history.back()" class="flex-1 bg-slate-200 dark:bg-slate-800 font-bold py-3 rounded-xl text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="action-modal" class="fixed inset-0 bg-black/60 glass-effect z-[70] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-darkCard w-full max-w-sm rounded-3xl p-6 shadow-2xl border border-slate-100 dark:border-slate-800">
            <h3 id="action-title" class="text-lg font-bold text-slate-800 dark:text-white mb-2"></h3>
            <textarea id="action-reason" rows="3" class="w-full bg-slate-100 dark:bg-slate-800 dark:text-white rounded-xl p-4 outline-none text-sm mt-3" placeholder="اكتب السبب أو الملاحظة هنا..."></textarea>
            <input type="hidden" id="action-type">
            <div class="flex gap-3 mt-4">
                <button onclick="submitAction()" id="btn-submit-action" class="flex-1 bg-primary text-white font-bold py-3 rounded-xl text-sm">إرسال للمشرف</button>
                <button onclick="history.back()" class="flex-1 bg-slate-200 dark:bg-slate-800 font-bold py-3 rounded-xl text-sm">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="fixed inset-0 bg-black/60 glass-effect z-[80] hidden flex items-center justify-center p-4">
        <div class="bg-white dark:bg-darkCard w-full max-w-md h-[80vh] rounded-3xl p-5 shadow-2xl flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b dark:border-slate-700 pb-3">
                <h3 class="font-bold text-lg">إدارة المتطوعين</h3>
                <button onclick="document.getElementById('admin-modal').classList.add('hidden')" class="w-8 h-8 bg-slate-100 dark:bg-slate-800 rounded-full"><i class="fa-solid fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto space-y-3" id="admin-users-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, onSnapshot, updateDoc, arrayUnion, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA9IgEbNeyt4OMiui6NBAnKh3MADWEqjLs",
            authDomain: "sanad14.firebaseapp.com",
            projectId: "sanad14",
            storageBucket: "sanad14.firebasestorage.app",
            messagingSenderId: "156399008172",
            appId: "1:156399008172:web:54d614ed0af8073fb86209",
            measurementId: "G-KJK0C7PGQC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const ADMIN_EMAIL = "fh14fh313@gmail.com";
        let currentUser = null;
        let currentUserData = null;
        let families = [];
        let formStep = 1;
        let detailsPage = 1;
        let activeFamilyId = null;

        const formFields = ["f-name", "f-marital", "f-spouse", "f-nid", "f-ration", "f-residence", "f-phone1", "f-phone2", "f-address", "f-nearest", "f-mukhtar", "f-category", "f-need-level", "f-priority", "f-reg-date", "f-researcher-notes", "f-fam-size", "f-kids-count", "f-orphans-count", "f-has-disability", "f-has-disease", "f-income-source", "f-income-amount", "f-housing-type", "f-housing-condition", "f-key-needs"];
        const fieldLabels = {"f-name": "الاسم", "f-marital": "الزوجية", "f-spouse": "الزوج/ة", "f-nid": "الوطنية", "f-ration": "التموينية", "f-residence": "السكن", "f-phone1": "هاتف", "f-phone2": "هاتف 2", "f-address": "العنوان", "f-nearest": "نقطة دالة", "f-mukhtar": "المختار", "f-category": "الصنف", "f-need-level": "الاحتياج", "f-priority": "الأولوية", "f-reg-date": "التسجيل", "f-researcher-notes": "ملاحظات", "f-fam-size": "الأفراد", "f-kids-count": "الأطفال", "f-orphans-count": "الأيتام", "f-has-disability": "إعاقة", "f-has-disease": "أمراض", "f-income-source": "مصدر الدخل", "f-income-amount": "المبلغ", "f-housing-type": "نوع السكن", "f-housing-condition": "حالة السكن", "f-key-needs": "الاحتياجات"};
        const pageFields = [
            ["f-name", "f-marital", "f-spouse", "f-nid", "f-ration", "f-residence", "f-phone1", "f-phone2", "f-address", "f-nearest", "f-mukhtar"],
            ["f-category", "f-need-level", "f-priority", "f-reg-date", "f-researcher-notes"],
            ["f-fam-size", "f-kids-count", "f-orphans-count", "f-has-disability", "f-has-disease"],
            ["f-income-source", "f-income-amount", "f-housing-type", "f-housing-condition", "f-key-needs"]
        ];

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                const userRef = doc(db, "users", user.email);
                const docSnap = await getDoc(userRef);
                
                if (!docSnap.exists()) {
                    const isAd = user.email === ADMIN_EMAIL;
                    await setDoc(userRef, {
                        name: user.displayName,
                        email: user.email,
                        role: isAd ? 'admin' : 'volunteer',
                        status: isAd ? 'approved' : 'pending'
                    });
                    currentUserData = { role: isAd ? 'admin' : 'volunteer', status: isAd ? 'approved' : 'pending' };
                } else {
                    currentUserData = docSnap.data();
                    if(user.email === ADMIN_EMAIL) currentUserData.role = 'admin'; 
                }

                document.getElementById("user-name-display").innerText = user.displayName;
                document.getElementById("user-email-display").innerText = user.email;
                document.getElementById("user-avatar").innerText = user.displayName.charAt(0);

                if (currentUserData.status === 'approved' || currentUserData.role === 'admin') {
                    showScreen("app-content");
                    if (currentUserData.role === 'admin') document.getElementById('admin-panel-btn').classList.remove('hidden');
                    loadData();
                } else {
                    showScreen("pending-screen");
                }
            } else {
                showScreen("login-screen");
            }
        });

        function showScreen(id) {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("pending-screen").classList.add("hidden");
            document.getElementById("app-content").classList.add("hidden");
            document.getElementById(id).classList.remove("hidden");
            if(id === "app-content") document.getElementById("app-content").classList.add("flex");
        }

        window.loginWithGoogle = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth);

        function loadData() {
            onSnapshot(collection(db, "families"), (snapshot) => {
                families = [];
                snapshot.forEach(doc => { families.push({ id: doc.id, ...doc.data() }); });
                renderFamilies();
                if(activeFamilyId && !document.getElementById('details-modal').classList.contains('hidden')){
                    if(document.getElementById('d-view-history').classList.contains('hidden') === false) renderAidTable();
                    if(document.getElementById('d-view-changes').classList.contains('hidden') === false) renderChangesTable();
                }
            });

            if (currentUserData.role === 'admin') {
                onSnapshot(collection(db, "users"), (snapshot) => {
                    const list = document.getElementById("admin-users-list");
                    list.innerHTML = "";
                    snapshot.forEach(d => {
                        const u = d.data();
                        if (u.status === 'pending') {
                            list.innerHTML += `<div class="bg-slate-50 dark:bg-slate-800 p-3 rounded-xl flex justify-between items-center"><div class="text-sm"><b>${u.name}</b><br><span class="text-xs text-slate-500">${u.email}</span></div><button onclick="approveUser('${u.email}')" class="bg-primary text-white px-4 py-1.5 rounded-lg text-xs font-bold">قبول</button></div>`;
                        }
                    });
                    if(list.innerHTML === "") list.innerHTML = "<p class="text-center text-slate-400 text-sm mt-5">لا يوجد متطوعين قيد الانتظار</p>";
                });
            }
        }

        window.approveUser = async (email) => {
            await updateDoc(doc(db, "users", email), { status: 'approved' });
        };

        window.openAdminModal = () => document.getElementById('admin-modal').classList.remove('hidden');

        window.addEventListener('hashchange', () => {
            const hash = window.location.hash.substring(1) || 'main';
            ['form-modal', 'fam-options-modal', 'details-modal', 'aid-modal', 'action-modal'].forEach(m => document.getElementById(m).classList.add('hidden'));
            if (['form-modal', 'fam-options-modal', 'details-modal', 'aid-modal', 'action-modal'].includes(hash)) {
                if(hash === 'aid-modal') document.getElementById('details-modal').classList.remove('hidden');
                document.getElementById(hash).classList.remove('hidden');
            } else {
                ['view-main', 'view-fav', 'view-settings'].forEach(v => document.getElementById(v).classList.add('hidden'));
                ['tab-main', 'tab-fav', 'tab-settings'].forEach(t => document.getElementById(t).className = "flex-1 py-4 text-center font-bold border-b-4 border-transparent text-indigo-200 transition-all");
                document.getElementById(`view-${hash}`).classList.remove('hidden');
                document.getElementById(`tab-${hash}`).className = "flex-1 py-4 text-center font-bold border-b-4 border-white transition-all";
                document.getElementById('search-container').style.display = hash === 'settings' ? 'none' : 'block';
                if(hash !== 'settings') renderFamilies();
            }
        });

        window.navigateTo = (hash) => { window.location.hash = hash; };

        window.renderFamilies = () => {
            const listDiv = document.getElementById('families-list'), favDiv = document.getElementById('fav-list');
            const q = (document.getElementById('search-input').value || '').toLowerCase();
            listDiv.innerHTML = ''; favDiv.innerHTML = '';
            let filtered = families.filter(f => (f.data['f-name'] || '').toLowerCase().includes(q));
            let favs = families.filter(f => f.favs && f.favs.includes(currentUser.email));
            
            document.getElementById('empty-state').classList.toggle('hidden', filtered.length > 0);
            filtered.forEach(f => listDiv.innerHTML += createCard(f));
            favs.forEach(f => favDiv.innerHTML += createCard(f));
        };

        function createCard(f) {
            const isFav = f.favs && f.favs.includes(currentUser.email);
            const favB = isFav ? '<i class="fa-solid fa-star text-yellow-400 absolute top-5 right-4 text-xs"></i>' : '';
            return `<div class="bg-white dark:bg-darkCard rounded-2xl shadow-sm border border-slate-100 dark:border-slate-800 relative flex items-center p-2 pr-4"><div class="flex-1 py-3 cursor-pointer pl-2 ${isFav?'pr-5':''}" onclick="openDetails('${f.id}')"><h3 class="font-bold flex items-center">${f.data['f-name']||'بدون اسم'}</h3></div><button onclick="openFamOptions('${f.id}')" class="w-12 h-12 flex items-center justify-center text-slate-400"><i class="fa-solid fa-ellipsis-vertical"></i></button>${favB}</div>`;
        }

        window.openFamOptions = (id) => { activeFamilyId = id; navigateTo('fam-options-modal'); };
        
        window.toggleFavAction = async () => {
            const f = families.find(x => x.id === activeFamilyId);
            let newFavs = f.favs || [];
            if(newFavs.includes(currentUser.email)) newFavs = newFavs.filter(e => e !== currentUser.email);
            else newFavs.push(currentUser.email);
            await updateDoc(doc(db, "families", f.id), { favs: newFavs });
            history.back();
        };

        window.openReportAction = () => { history.back(); setTimeout(()=>{ setupAction('report', 'إبلاغ عن عائلة'); }, 100); };
        window.openDeleteAction = () => { history.back(); setTimeout(()=>{ setupAction('delete', 'طلب حذف عائلة'); }, 100); };
        
        function setupAction(type, title) {
            document.getElementById('action-type').value = type;
            document.getElementById('action-title').innerText = title;
            document.getElementById('action-reason').value = '';
            navigateTo('action-modal');
        }

        window.submitAction = async () => {
            const type = document.getElementById('action-type').value;
            const reason = document.getElementById('action-reason').value;
            const f = families.find(x => x.id === activeFamilyId);
            const btn = document.getElementById('btn-submit-action');
            btn.innerText = "جاري الإرسال..."; btn.disabled = true;

            const msg = `النوع: ${type === 'delete' ? 'طلب حذف' : 'بلاغ'}\nالعائلة: ${f.data['f-name']}\nالمتطوع: ${currentUser.displayName}\nالسبب: ${reason}`;
            try {
                await fetch("https://formsubmit.co/ajax/fh14fh313@gmail.com", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ _subject: `إشعار نظام العوائل: ${f.data['f-name']}`, message: msg })
                });
                alert("تم إرسال الرسالة للمشرف بنجاح.");
            } catch(e) {}
            
            btn.innerText = "إرسال للمشرف"; btn.disabled = false;
            history.back();
        };

        window.openFormStep = (step) => {
            formStep = step;
            for(let i=1; i<=4; i++) {
                document.getElementById(`form-step-${i}`).classList.add('hidden');
                document.getElementById(`step-ind-${i}`).className = "flex-1 py-3 text-xs transition-colors " + (formStep === i ? "bg-primary text-white" : "text-slate-500");
            }
            document.getElementById(`form-step-${formStep}`).classList.remove('hidden');
            document.getElementById('btn-prev').style.display = formStep === 1 ? 'none' : 'block';
            document.getElementById('btn-next').style.display = formStep === 4 ? 'none' : 'block';
            document.getElementById('btn-save').style.display = formStep === 4 ? 'block' : 'none';

            if(step === 1 && !document.getElementById('f-id').value) {
                formFields.forEach(id => document.getElementById(id).value = '');
                document.getElementById('form-title').innerText = 'إضافة عائلة';
            }
            document.getElementById('volunteer-indicator').innerText = `بواسطة المتطوع: ${currentUser.displayName}`;
        };

        window.changeFormStep = (dir) => { formStep += dir; if(formStep<1)formStep=1; if(formStep>4)formStep=4; window.openFormStep(formStep); };

        window.saveFamily = async () => {
            const id = document.getElementById('f-id').value;
            let famData = {};
            formFields.forEach(field => famData[field] = document.getElementById(field).value);
            
            const logEntry = { date: new Date().toISOString(), user: currentUser.displayName, action: id ? "تعديل بيانات العائلة الأساسية" : "إضافة العائلة للنظام" };

            if(id) {
                await updateDoc(doc(db, "families", id), { data: famData, changes: arrayUnion(logEntry) });
            } else {
                await addDoc(collection(db, "families"), { data: famData, favs: [], aids: [], changes: [logEntry] });
            }
            history.back();
        };

        window.openDetails = (id) => {
            activeFamilyId = id;
            document.getElementById('details-title').innerText = families.find(x => x.id === id).data['f-name'];
            window.switchDetailsTab('info');
            window.changeDetailsPage(0, 1);
            navigateTo('details-modal');
        };

        window.switchDetailsTab = (tab) => {
            ['info', 'history', 'changes'].forEach(t => {
                document.getElementById(`d-view-${t}`).classList.add('hidden');
                document.getElementById(`d-tab-${t}`).className = "flex-1 py-4 text-slate-500 font-bold border-b-2 border-transparent whitespace-nowrap px-4";
            });
            document.getElementById(`d-view-${tab}`).classList.remove('hidden');
            document.getElementById(`d-tab-${tab}`).className = "flex-1 py-4 text-primary font-bold border-b-2 border-primary whitespace-nowrap px-4";
            
            if(tab === 'history') renderAidTable();
            if(tab === 'changes') renderChangesTable();
        };

        window.changeDetailsPage = (dir, abs = null) => {
            if(abs) detailsPage = abs; else detailsPage += dir;
            if(detailsPage < 1) detailsPage = 1; if(detailsPage > 4) detailsPage = 4;
            const f = families.find(x => x.id === activeFamilyId);
            let html = '';
            pageFields[detailsPage - 1].forEach(field => {
                html += `<div><span class="text-xs text-slate-400 block mb-1">${fieldLabels[field]}</span><div class="font-bold text-sm">${f.data[field]||'-'}</div></div>`;
            });
            document.getElementById('d-info-content').innerHTML = html;
            document.getElementById('d-btn-prev').style.visibility = detailsPage === 1 ? 'hidden' : 'visible';
            document.getElementById('d-btn-next').style.visibility = detailsPage === 4 ? 'hidden' : 'visible';
        };

        window.editCurrentDetailsPage = () => {
            const f = families.find(x => x.id === activeFamilyId);
            document.getElementById('f-id').value = f.id;
            formFields.forEach(field => document.getElementById(field).value = f.data[field] || '');
            document.getElementById('form-title').innerText = 'تعديل بيانات العائلة';
            navigateTo('form-modal');
            window.openFormStep(detailsPage);
        };

        function renderAidTable() {
            const f = families.find(x => x.id === activeFamilyId);
            const container = document.getElementById('aid-content-container');
            if(!f.aids || f.aids.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">لا توجد مساعدات مسجلة</div>`; return;
            }
            container.innerHTML = f.aids.map(r => `<div class="bg-white dark:bg-darkCard p-4 rounded-xl border border-slate-100 dark:border-slate-800">
                <div class="font-bold mb-1">${r.type} <span class="text-xs ${r.status==='تم تلبيتها'?'text-emerald-500':'text-orange-500'}">(${r.status})</span></div>
                <div class="text-xs text-slate-500"><i class="fa-solid fa-user-circle"></i> ${r.volunteer} | <span class="font-sans">${new Date(r.date).toLocaleDateString('en-GB')}</span></div>
            </div>`).join('');
        }

        function renderChangesTable() {
            const f = families.find(x => x.id === activeFamilyId);
            const container = document.getElementById('changes-content-container');
            if(!f.changes || f.changes.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-slate-400 text-sm">لا توجد تعديلات مسجلة</div>`; return;
            }
            container.innerHTML = [...f.changes].reverse().map(c => `<div class="bg-white dark:bg-darkCard p-3 rounded-xl border border-slate-100 dark:border-slate-800 flex gap-3 items-start">
                <div class="w-8 h-8 rounded-full bg-primary/10 text-primary flex items-center justify-center flex-shrink-0 mt-1"><i class="fa-solid fa-pen text-xs"></i></div>
                <div><div class="text-sm font-bold">${c.action}</div>
                <div class="text-xs text-slate-500 mt-1"><i class="fa-solid fa-user"></i> ${c.user} • <span class="font-sans" dir="ltr">${new Date(c.date).toLocaleString('en-GB')}</span></div></div>
            </div>`).join('');
        }

        window.openAddAidModal = () => {
            document.getElementById('aid-type').value = '';
            document.getElementById('aid-status').value = 'تم تلبيتها';
            navigateTo('aid-modal');
        };

        window.saveAid = async () => {
            const type = document.getElementById('aid-type').value;
            if(!type) return;
            const f = families.find(x => x.id === activeFamilyId);
            const newAid = { type, status: document.getElementById('aid-status').value, volunteer: currentUser.displayName, date: new Date().toISOString() };
            const logEntry = { date: new Date().toISOString(), user: currentUser.displayName, action: `إضافة مساعدة: ${type}` };
            await updateDoc(doc(db, "families", f.id), { aids: arrayUnion(newAid), changes: arrayUnion(logEntry) });
            history.back();
        };

        window.toggleTheme = () => document.documentElement.classList.toggle('dark', document.getElementById('dark-mode-toggle').checked);
        window.changeFontSize = (size) => document.documentElement.style.fontSize = size;
    </script>
</body>
</html>
